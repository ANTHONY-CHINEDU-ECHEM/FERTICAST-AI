[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ferticast"
version = "1.0.0"
description = "Calibrated, explainable pre treatment IVF live birth prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "xgboost>=2.0", "lightgbm>=4.3", "shap>=0.45",
    "matplotlib>=3.8", "pyyaml>=6.0", "joblib>=1.3", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6",
    "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E702"]
